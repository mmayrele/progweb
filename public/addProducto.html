<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi página</title>
    <link type="text/css" rel="stylesheet" href="style/style.css">
    <script src="js/script.js" type="text/javascript"></script>
    <link type="favicon" rel="icon" href="favicon.png">
    <script type="text/javascript">
        document.addEventListener("DOMContentLoaded", function() {
            const productToEdit = localStorage.getItem('productToEdit');
            if (productToEdit) {
                const product = JSON.parse(productToEdit);
                document.getElementById('id').value = product.id || '';
                document.getElementById('nombre').value = product.nombre || '';
                document.getElementById('codigo').value = product.codigo || '';
                document.getElementById('tipo').value = product.tipo || '1';
                document.getElementById('costo').value = product.costo || '';
                document.getElementById('precio').value = product.precio || '';
                document.getElementById('pagaItbis').checked = product.pagaItbis || false;
                document.getElementById('itbis').value = product.itbis || '';
            }
        });
    </script>
</head>

<body>
    <header>
        <div class="logo">
            <img src="img/logo.png" width="auto" height="45" alt="Logo de la página">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="about.html">Acerca de</a></li>
                <li><a href="contact.html">Contacto</a></li>
                <li><a class="active" href="portafolio.html">Portafolio</a></li>
            </ul>
        </nav>
        <nav class="login">
            <ul>
                <li class="login-link"><img src="img/persona.png" alt="Iniciar sesión"></li>
                <li class="login-link-text"><a href="login.html">Iniciar sesión</a></li>
                <li><a href="register.html">Registrarse</a></li>
            </ul>
        </nav>
    </header>
    <div class="banner">
        <img src="img/banner.png" width="100%" height="400" alt="Banner de la página">
    </div>
    <div class="content">
        <div class="content-full-left-right">
            <h1>Agregar producto</h1>
        </div>
        <div class="list">
            <form action="http://127.0.0.1/uasd/prog/index.php?action=saveProduct" method="post">                                
                <input type="hidden" id="id" name="id" value="">
                <fieldset>
                    <legend>Datos Generales</legend>
                    <div class="field-group-100">
                        <label>Nombre del Producto: </label>
                        <input type="text" id="nombre" name="nombre" value="" placeholder="Colocar el nombre del producto">
                    </div>

                    <div class="field-group-100">
                        <div class="field-group-50">
                            <label>Código: </label>
                            <input type="text"  id="codigo" name="codigo" value="" placeholder="00001">
                        </div>

                        <div class="field-group-50">
                            <label>Tipo del Producto: </label>
                            <select id="tipo" name="tipo">
                                <option value="1">Venta</option>
                                <option value="2">Servicio</option>
                                <option value="3">Oferta</option>
                            </select>
                        </div>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Datos Financieros</legend>
                    <div class="field-group-100">
                        <div class="field-group-50">
                            <label>Costo del Producto $: </label>
                            <input type="number" id="costo" name="costo" value="" placeholder="$100.00">
                        </div>
                        <div class="field-group-50">
                            <label>Precio del Producto $: </label>
                            <input type="number"  id="precio" name="precio" value="" placeholder="$150.22">
                        </div>
                    </div>

                    <div class="field-group-100">
                        <div class="field-group-50">
                            <label>Paga Itbis: </label>
                            <input type="checkbox"  id="pagaItbis" name="pagaItbis">
                        </div>
                        <div class="field-group-50">
                            <label>ITBIS:</label>
                            <input type="number"  id="itbis" name="itbis" value="" placeholder="18">
                        </div>
                    </div>
                </fieldset>

                <div class="content-full-center">
                    <button class="btn btn-danger" type="reset">Cancelar</button>
                    <input class="btn btn-success" type="submit" value="Guardar Form">
                    <button type="button" id="SaveFormJson" class="btn btn-success">Guardar Json</button>
                </div>
            </form>
        </div>
    </div>
    <footer>
        <p>&copy; 2026 Mi página. Todos los derechos reservados.</p>
    </footer>
</body>

</html>
